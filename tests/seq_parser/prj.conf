# Zephyr test environment
CONFIG_ZTEST=y
CONFIG_TEST=y

# Stack ja heapit hieman isommiksi testejä varten
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# UART-konsoli (nRF5340 Audio tukee tätä)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Ei Bluetoothia, ei verkkoa testejä varten
CONFIG_BT=n
CONFIG_NETWORKING=n
